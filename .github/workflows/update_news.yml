name: Update Imabari News Data

on:
schedule:
# UTC時間での指定 (日本時間JSTから-9時間)
# 日本時間 09:00, 15:00, 21:00 に実行
- cron: '0 0,6,12 * * *'
workflow_dispatch: # GitHubの画面から手動で実行できるボタンを有効化

jobs:
scrape-and-update:
runs-on: ubuntu-latest
permissions:
contents: write # リポジトリへの書き込み権限を付与

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.10'

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  - name: Run scraper script
    run: python scraper.py

  - name: Commit and push changes
    run: |
      git config --global user.email "github-actions[bot]@users.noreply.github.com"
      git config --global user.name "github-actions[bot]"
      git add news_data.json
      # 変更がある場合のみコミットしてプッシュする
      git diff --quiet && git diff --staged --quiet || (git commit -m "Update news data automatically" && git push)
